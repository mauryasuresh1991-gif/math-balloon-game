<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मैथ्स बलून एडिशन गेम</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }
        /* Top Dashboard */
        .header {
            background: rgba(255, 255, 255, 0.9);
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .stats div {
            font-size: 18px;
            font-weight: bold;
            color: #2d3436;
            display: inline-block;
            margin-right: 20px;
        }
        .stats span {
            color: #0984e3;
        }
        /* Question Board */
        .question-box {
            background: #fff;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 32px;
            font-weight: bold;
            color: #d63031;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            margin-top: 20px;
            z-index: 10;
            border: 4px solid #fab1a0;
        }
        /* Game Area */
        .game-area {
            position: relative;
            width: 100%;
            flex-grow: 1;
            overflow: hidden;
        }
        /* Balloons */
        .balloon {
            position: absolute;
            bottom: -80px;
            width: 70px;
            height: 90px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.3);
            animation: floatUp linear forwards;
            z-index: 5;
        }
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 31px;
            width: 8px;
            height: 12px;
            background: inherit;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        .balloon::before {
            content: "";
            position: absolute;
            bottom: -22px;
            left: 34px;
            width: 2px;
            height: 12px;
            background: #636e72;
        }
        @keyframes floatUp {
            0% { bottom: -100px; transform: scale(0.8); }
            50% { transform: scale(1); }
            100% { bottom: 105vh; }
        }
        /* Popups & Feedback */
        .feedback-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 80px;
            z-index: 100;
            transition: transform 0.3s ease;
            pointer-events: none;
        }
        .feedback-overlay.show {
            transform: translate(-50%, -50%) scale(1);
        }
        /* Modal Popup for Level Up */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            display: none;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: popIn 0.4s ease;
        }
        .modal-content h2 {
            color: #00b894;
            font-size: 36px;
            margin-bottom: 15px;
        }
        .modal-content p {
            font-size: 20px;
            color: #636e72;
            margin-bottom: 25px;
        }
        .btn {
            background: #00b894;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,184,148,0.4);
        }
        .btn:hover {
            background: #019875;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Header Stats -->
    <div class="header">
        <div class="stats">
            <div>स्कोर: <span id="score">0</span></div>
            <div>लेवल: <span id="level">1</span></div>
            <div>स्टेज: <span id="stage">1/10</span></div>
        </div>
        <div class="stats">
            <div>लाइफ: <span id="lives">❤️❤️❤️</span></div>
        </div>
    </div>

    <!-- Question Box -->
    <div class="question-box" id="questionBox">जोड़ो: ? + ? = ?</div>

    <!-- Game Playing Field -->
    <div class="game-area" id="gameArea">
        <div id="feedback" class="feedback-overlay">👍</div>
    </div>

    <!-- Level Complete Modal -->
    <div class="modal" id="levelModal">
        <div class="modal-content">
            <h2 id="modalTitle">शानदार!</h2>
            <p id="modalText">आपने सफलतापूर्वक नया लेवल पार कर लिया है।</p>
            <button class="btn" onclick="nextLevel()">अगला लेवल शुरू करें</button>
        </div>
    </div>

    <script>
        let score = 0;
        let level = 1;
        let stageInLevel = 1;
        let lives = 3;
        let currentNum1 = 0, currentNum2 = 0, correctAnswer = 0;
        let activeBalloons = [];
        let gameInterval;
        let spawnTimer;
        let speedMultiplier = 6; // गति नियंत्रण

        const colors = ['#e84118', '#0097e6', '#44bd32', '#9c88ff', '#fbc531', '#e84393', '#00cec9'];

        // वेब ऑडियो API आवाज़ के लिए
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        function startGame() {
            generateNewQuestion();
            startBalloonSpawner();
        }

        // कठिनाई और अंकों का निर्धारण (Level & Digit logic)
        function generateNewQuestion() {
            let min = 1, max = 9;
            if (level === 1) { // Single + Single
                min = 1; max = 9;
            } else if (level === 2) { // Two Digit + Single Digit
                min = 10; max = 49; // शुरुआत आसान रखने के लिए
            } else if (level === 3) { // Two Digit + Two Digit
                min = 10; max = 99;
            } else if (level >= 4) { // Three Digit तक
                min = 50; max = 999;
            }

            currentNum1 = Math.floor(Math.random() * (max - min + 1)) + min;
            currentNum2 = Math.floor(Math.random() * (max - min + 1)) + min;
            correctAnswer = currentNum1 + currentNum2;

            document.getElementById('questionBox').innerText = `${currentNum1} + ${currentNum2} = ?`;
            
            // बलून्स बनाएं
            createBalloonsSet();
        }

        function createBalloonsSet() {
            // पुराने बलून्स हटाएं
            document.querySelectorAll('.balloon').forEach(b => b.remove());
            
            // 3 या 4 विकल्प बनाएं जिसमें एक सही हो और बाकी गलत
            let options = [correctAnswer];
            while (options.length < 4) {
                let offset = Math.floor(Math.random() * 15) - 7;
                let wrongAns = correctAnswer + (offset === 0 ? 3 : offset);
                if (wrongAns > 0 && !options.includes(wrongAns)) {
                    options.push(wrongAns);
                }
            }
            // विकल्प सफल फेरबदल (Shuffle)
            options.sort(() => Math.random() - 0.5);

            const gameArea = document.getElementById('gameArea');
            let screenWidth = gameArea.clientWidth - 80;

            options.forEach((ans, index) => {
                let balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.innerText = ans;
                balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // स्क्रीन पर अलग-अलग पोजीशन देना
                let leftPos = (screenWidth / 4) * index + Math.random() * 30;
                balloon.style.left = leftPos + 'px';
                
                // लेवल बढ़ने के साथ बैलून ऊपर जाने की स्पीड बढ़ेगी
                let duration = Math.max(4, 10 - (level * 0.8));
                balloon.style.animationDuration = duration + 's';

                balloon.onclick = () => checkAnswer(ans, balloon);
                
                // अगर बलून ऊपर पार हो जाए (Animation End)
                balloon.addEventListener('animationend', () => {
                    balloon.remove();
                    // अगर सही उत्तर वाला बलून बिना फूटे निकल गया तो मिस हो गया माना जाएगा
                    if (ans === correctAnswer) {
                        handleMissedAnswer();
                    }
                });

                gameArea.appendChild(balloon);
            });
        }

        function checkAnswer(selectedAns, balloonElement) {
            let feedback = document.getElementById('feedback');
            
            if (selectedAns === correctAnswer) {
                playSound('correct');
                feedback.innerText = "👍 Well Done!";
                feedback.style.color = "#00b894";
                feedback.classList.add('show');
                
                score += 10;
                stageInLevel++;
                document.getElementById('score').innerText = score;
                
                balloonElement.remove();
                document.querySelectorAll('.balloon').forEach(b => b.remove()); // बाकी बलून्स हटाएँ

                setTimeout(() => {
                    feedback.classList.remove('show');
                    checkStageProgress();
                }, 600);

            } else {
                playSound('wrong');
                feedback.innerText = "❌ Oops!";
                feedback.style.color = "#d63031";
                feedback.classList.add('show');
                
                balloonElement.style.opacity = '0.3'; // गलत बलून को हल्का कर दें
                setTimeout(() => feedback.classList.remove('show'), 500);
            }
        }

        function handleMissedAnswer() {
            lives--;
            let hearts = "";
            for(let i=0; i<lives; i++) hearts += "❤️";
            document.getElementById('lives').innerText = hearts;

            if (lives <= 0) {
                alert("गेम ओवर! आपका स्कोर: " + score);
                resetGame();
            } else {
                generateNewQuestion(); // नया सवाल दें
            }
        }

        function checkStageProgress() {
            if (stageInLevel > 10) { // हर 10 स्टेज पर नया लेवल
                level++;
                stageInLevel = 1;
                document.getElementById('level').innerText = level;
                
                // पॉप अप दिखाएं
                document.getElementById('modalTitle').innerText = `लेवल ${level - 1} पूरा हुआ! 🎉`;
                document.getElementById('modalText').innerText = `बधाई हो! अब कठिनाई स्तर ${level} शुरू हो रहा है।`;
                document.getElementById('levelModal').style.display = 'flex';
            } else {
                document.getElementById('stage').innerText = `${stageInLevel}/10`;
                generateNewQuestion();
            }
        }

        function nextLevel() {
            document.getElementById('levelModal').style.display = 'none';
            document.getElementById('stage').innerText = `${stageInLevel}/10`;
            generateNewQuestion();
        }

        function resetGame() {
            score = 0;
            level = 1;
            stageInLevel = 1;
            lives = 3;
            document.getElementById('score').innerText = score;
            document.getElementById('level').innerText = level;
            document.getElementById('stage').innerText = `1/10`;
            document.getElementById('lives').innerText = "❤️❤️❤️";
            generateNewQuestion();
        }

        // गेम शुरू करें
        window.onload = startGame;
    </script>
</body>
</html>
