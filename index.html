<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>गेम हब</title>
    <style>
        body { background: linear-gradient(135deg, #74b9ff, #a29bfe); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
        .card { background: white; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 90%; max-width: 400px; }
        input { padding: 12px; width: 100%; margin: 10px 0; border-radius: 10px; border: 1px solid #ccc; }
        .btn { padding: 12px 30px; cursor: pointer; background: #00b894; color: white; border: none; border-radius: 30px; font-size: 18px; margin: 10px 0; width: 100%; }
        #menuSection { display: none; }
    </style>
</head>
<body>

    <!-- 1. लॉगिन सेक्शन -->
    <div id="loginSection" class="card">
        <h2>स्वागत है!</h2>
        <input type="text" id="userName" placeholder="अपना नाम लिखें">
        <input type="number" id="userAge" placeholder="अपनी उम्र लिखें">
        <button class="btn" onclick="saveProfile()">शुरू करें</button>
    </div>

    <!-- 2. मेनू सेक्शन -->
    <div id="menuSection" class="card">
        <h2>नमस्ते, <span id="displayName"></span>!</h2>
        <p>अपना पसंदीदा गेम चुनें:</p>
        
        <button class="btn" onclick="window.location.href='addition.html'">एडिशन गेम (जोड़)</button>
        <button class="btn" style="background-color: #e17055;" onclick="window.location.href='magic slate.html'">magic slate</button>
        
        <button class="btn" style="background-color: #636e72;" onclick="logout()">लॉग आउट</button>
    </div>

    <script>
        function saveProfile() {
            const name = document.getElementById('userName').value;
            const age = document.getElementById('userAge').value;
            if(name && age) {
                localStorage.setItem('playerName', name);
                localStorage.setItem('playerAge', age);
                location.reload();
            } else { alert("कृपया नाम और उम्र भरें!"); }
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        window.onload = function() {
            if(localStorage.getItem('playerName')) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('menuSection').style.display = 'block';
                document.getElementById('displayName').innerText = localStorage.getItem('playerName');
            }
        };
    </script>
</body>
</html>
